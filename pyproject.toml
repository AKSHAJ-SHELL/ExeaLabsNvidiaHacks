[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "arrival-sim"
version = "0.1.0"
description = "Arrival: one room scan -> digital twin -> MuJoCo-simulated LeRobot v2 demos for GR00T (arm, people, closed-loop eval; a scripted placeholder dataset is also available)."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "pyarrow",
  "pyyaml",
  "pillow",
  "imageio",
  "imageio-ffmpeg",
]

[project.optional-dependencies]
dev = ["pytest"]
sim = ["mujoco>=3.1"]

[project.scripts]
arrival = "arrival.cli:main"

[tool.setuptools.packages.find]
include = ["arrival*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
