:root{
  --paper:#F1EBDD;
  --ink:#141414;
  --signal:#E5481F;
  --font-display:"Fraunces", Georgia, serif;
  --font-label:"DM Mono", ui-monospace, Menlo, monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--paper)}
html.transparent,html.transparent body{background:transparent}
#root{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0}
#root svg{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:visible;display:block}

/* drawing language */
svg .ink{fill:none;stroke:var(--ink);stroke-width:3;stroke-linejoin:miter;stroke-linecap:butt}
svg .wall{fill:none;stroke:var(--ink);stroke-width:11;stroke-linejoin:miter;stroke-linecap:butt}
svg .hair{fill:none;stroke:var(--ink);stroke-width:1.5}
svg .fine{fill:none;stroke:var(--ink);stroke-width:1.5;opacity:.55}
svg .grid{fill:none;stroke:var(--ink);stroke-width:1;opacity:.09}
svg .grid.major{opacity:.17}
svg .sig{fill:none;stroke:var(--signal);stroke-width:3}
svg .sigfill{fill:var(--signal);stroke:none}
svg .inkfill{fill:var(--ink);stroke:none}
svg .dash{stroke-dasharray:9 7}
svg .dashfine{stroke-dasharray:4 5}
svg .lbl{font-family:var(--font-label);font-weight:400;font-size:17px;letter-spacing:.12em;fill:var(--ink);text-transform:uppercase}
svg .lbl.sm{font-size:14px;letter-spacing:.1em}
svg .lbl.dim{opacity:.6}
svg .lbl.hot{fill:var(--signal)}
svg .disp{font-family:var(--font-display);font-variation-settings:"opsz" 144,"SOFT" 0,"WONK" 0;fill:var(--ink)}
svg text{white-space:pre}
</style>
